[project]
name = "freelancer-work-tracker-api"
version = "1.0.0"
description = "FastAPI backend for Freelancer Work Tracker"
requires-python = ">=3.12"
# Keep in sync with requirements.txt (used for local dev).
dependencies = [
    "fastapi==0.140.0",
    "uvicorn==0.51.0",
    "gunicorn==26.0.0",
    "sqlalchemy==2.0.51",
    "psycopg2-binary==2.9.13",
    "cryptography==49.0.0",
    "python-dotenv==1.2.2",
    "passlib[bcrypt]==1.7.4",
    "bcrypt==4.0.1",
    "python-jose==3.5.0",
    "groq==1.6.0",
    "python-multipart==0.0.32",
    "email-validator==2.3.0",
    "httpx==0.28.1",
]

# This is an application, not a library: install dependencies only, build no package.
[tool.setuptools]
packages = []

[tool.uv]
package = false

[tool.vercel]
entrypoint = "app.main:app"
